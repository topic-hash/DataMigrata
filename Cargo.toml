[package]
name = "datamigrata"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["DataMigrata Team"]
description = "Intelligent Oracle-to-MSSQL semantic translation middleware — Rust + DataFusion + sqlparser-rs"
license = "MIT"
repository = "https://github.com/topic-hash/DataMigrata"

[[bin]]
name = "datamigrata"
path = "src/main.rs"

[lib]
name = "datamigrata"
path = "src/lib.rs"

[dependencies]
# SQL parsing — Rust-native, supports Oracle constructs (CONNECT BY, DECODE, NVL, ROWNUM, (+) outer joins, DUAL)
sqlparser = { version = "0.44", features = ["visitor"] }

# IR + optimizer — Rust-native equivalent of Apache Calcite
datafusion = "36"

# Async runtime — proven at RisingWave scale, 5-10x lower memory than Java equivalents
tokio = { version = "1", features = ["full"] }

# Zero-copy binary parsing for TNS protocol (greenfield — no Rust TNS impl exists yet)
winnow = "0.6"

# Bytes / zero-copy buffer handling
bytes = "1"

# Tracing / structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling — anyhow for application errors, thiserror for library errors
anyhow = "1"
thiserror = "1"

# Serde for config / IR serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# TDS client (pure-Rust, async, tokio-native) for outgoing MSSQL connections
tiberius = { version = "0.12", features = ["rustls"] }
async-trait = "0.1"

[dev-dependencies]
# Property-based testing for IR invariants
proptest = "1"
# Snapshot testing for the 50 SQL operations
insta = { version = "1", features = ["yaml"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "pipeline_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
