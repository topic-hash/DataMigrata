# CODESPACE.yaml — codespacectl manifest for DataMigrata
# https://github.com/topic-hash/codespacectl
apiVersion: v1
metadata:
  name: datamigrata
  description: Oracle→MSSQL semantic translation middleware (Rust + DataFusion + sqlparser-rs)
  repo: topic-hash/DataMigrata

environment:
  workingDir: /workspaces/DataMigrata
  healthChecks:
    - name: repo
      command: ls /workspaces/DataMigrata/Cargo.toml
      expectExitCode: 0
      timeoutSecs: 5
    - name: sql-files
      command: ls /workspaces/DataMigrata/sql/00_COMPLETE_MSSQL_Deployment.sql
      expectExitCode: 0
      timeoutSecs: 5
    - name: cargo
      command: command -v cargo && cargo --version
      expectExitCode: 0
      timeoutSecs: 10
  secrets:
    - name: MSSQL_SA_PASSWORD
      required: false
      generateIfMissing:
        length: 24
        charset: alnum+symbols

commands:
  setup-rust:
    description: Install Rust stable via rustup (one-time, idempotent)
    command: |
      if ! command -v cargo >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
        . "$HOME/.cargo/env"
      fi
      cargo --version
    timeoutSecs: 300

  build:
    description: Build the DataMigrata Rust pipeline (release)
    command: . "$HOME/.cargo/env" 2>/dev/null; cd {{workingDir}} && cargo build --release
    timeoutSecs: 600
    requiresHealth: [repo]

  test:
    description: Run the 50-operation integration test suite
    command: . "$HOME/.cargo/env" 2>/dev/null; cd {{workingDir}} && cargo test --test operations_50
    timeoutSecs: 600
    requiresHealth: [repo]

  bench:
    description: Run the pipeline benchmarks
    command: . "$HOME/.cargo/env" 2>/dev/null; cd {{workingDir}} && cargo bench
    timeoutSecs: 1200
    requiresHealth: [repo]

  clippy:
    description: Run clippy with warnings as errors
    command: . "$HOME/.cargo/env" 2>/dev/null; cd {{workingDir}} && cargo clippy -- -D warnings
    timeoutSecs: 300
    requiresHealth: [repo]

  fmt-check:
    description: Verify code formatting
    command: . "$HOME/.cargo/env" 2>/dev/null; cd {{workingDir}} && cargo fmt --check
    timeoutSecs: 60
    requiresHealth: [repo]

  docker-up:
    description: Start the MSSQL Docker container
    command: cd {{workingDir}}/docker && docker compose up -d
    timeoutSecs: 120

  docker-status:
    description: Check Docker container status
    command: docker ps
    timeoutSecs: 10

  deploy-sql:
    description: Deploy the full MSSQL schema + 20K rows (~2 minutes)
    command: |
      cd {{workingDir}}
      /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "{{secret.MSSQL_SA_PASSWORD}}" \
        -i sql/00_COMPLETE_MSSQL_Deployment.sql
    timeoutSecs: 600
    requiresHealth: [repo, sql-files]

  run-50-ops:
    description: Run the 50 sophisticated MSSQL operations against the deployed DB
    command: |
      cd {{workingDir}}
      /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "{{secret.MSSQL_SA_PASSWORD}}" \
        -i sql/02_MSSQL_50_Operations_Expanded.sql
    timeoutSecs: 600
    requiresHealth: [repo, sql-files]

  ls:
    description: List repo root
    command: ls -la {{workingDir}}
    timeoutSecs: 5

  git-status:
    description: Git status inside codespace
    command: cd {{workingDir}} && git status
    timeoutSecs: 10

  uname:
    description: Codespace OS info
    command: uname -a
    timeoutSecs: 5

hooks:
  preStop:
    - command: cd {{workingDir}}/docker && docker compose down 2>/dev/null || true
      timeoutSecs: 30
