[package]
name = "datamigrata-tds"
version = "0.1.0"
edition = "2021"
description = "TDS protocol listener that dispatches to DuckDB-backed operation handlers"

[dependencies]
tokio = { version = "1", features = ["full"] }
duckdb = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "tds_server"
path = "src/main.rs"
